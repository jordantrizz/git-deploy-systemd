name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: shellcheck -S warning bin/git-deploy-systemd install.sh

      - name: PHP lint
        run: php -l bin/git-deploy-systemd.php

      - name: Integration tests
        run: bash tests/test-git-deploy-systemd.sh
